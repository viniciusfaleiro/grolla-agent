# Ambiente local e de testes integrados.
#   docker compose up -d db             # só o Postgres, para desenvolvimento e testes do pacote
#   make e2e                            # sobe api, worker, db e fakes (profile e2e) e roda os cenários
# A porta do Postgres no host é 5433 para não colidir com outros projetos locais na 5432.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: grolla
      POSTGRES_USER: grolla
      POSTGRES_PASSWORD: grolla
    ports:
      - "5433:5432"
    volumes:
      - grolla-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grolla -d grolla"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: packages/grolla-api/Dockerfile
    image: grolla-api:local
    profiles: ["e2e"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      GROLLA_DATABASE_URL: postgresql://grolla:grolla@db:5432/grolla
      GROLLA_CONFIG_FILE: /etc/grolla/grolla.yaml
      GROLLA_ALERTS_WEBHOOK_USER: signoz
      GROLLA_ALERTS_WEBHOOK_PASSWORD: segredo-do-e2e
    volumes:
      - ./e2e/config.yaml:/etc/grolla/grolla.yaml:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

  worker:
    build:
      context: .
      dockerfile: packages/grolla-worker/Dockerfile
      args:
        GROLLA_RAG_MODELS: small  # o e2e usa memory.rag.size small; imagem menor e build mais rápido
    image: grolla-worker:local
    profiles: ["e2e"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      GROLLA_DATABASE_URL: postgresql://grolla:grolla@db:5432/grolla
      # O Teams do e2e é a rota /teams/webhook do grolla-fakes.
      GROLLA_TEAMS_WEBHOOK_URL: http://fakes:9000/teams/webhook
      GROLLA_CONFIG_FILE: /etc/grolla/grolla.yaml
      # LLM, MCP do SigNoz e Azure DevOps também são o grolla-fakes (ver e2e/config.yaml).
      GROLLA_ANTHROPIC_API_KEY: chave-do-e2e
      GROLLA_ANTHROPIC_BASE_URL: http://fakes:9000/anthropic
      GROLLA_AZURE_DEVOPS_TOKEN: token-do-e2e
    volumes:
      - ./e2e/config.yaml:/etc/grolla/grolla.yaml:ro

  fakes:
    build:
      context: .
      dockerfile: e2e/fakes/Dockerfile
    image: grolla-fakes:local
    profiles: ["e2e"]
    environment:
      # O console de testes (http://localhost:9000/_console) dispara alertas no webhook da api.
      GROLLA_FAKES_API_URL: http://api:8000
      GROLLA_FAKES_API_USER: signoz
      GROLLA_FAKES_API_PASSWORD: segredo-do-e2e
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/_control/requests')"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  grolla-pgdata:
