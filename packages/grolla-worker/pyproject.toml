[project]
name = "grolla-worker"
# A versão do produto vive só no pyproject.toml do projeto pai; os pacotes não são publicados.
version = "0.0.0"
description = "Deployable de jobs do agent-grolla: timers, investigação e notificações."
requires-python = ">=3.12,<3.13"
dependencies = [
    "grolla-core",
    "procrastinate",
]

[project.scripts]
grolla-worker = "grolla_worker.main:main"

[tool.uv.sources]
grolla-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grolla_worker"]
