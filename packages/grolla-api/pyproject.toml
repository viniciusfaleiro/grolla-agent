[project]
name = "grolla-api"
# A versão do produto vive só no pyproject.toml do projeto pai; os pacotes não são publicados.
version = "0.0.0"
description = "Deployable HTTP do agent-grolla: webhooks de entrada e app web."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "grolla-core",
    "jinja2",
    "python-multipart",  # upload da transcrição da call
    "uvicorn",
]

[project.scripts]
grolla-api = "grolla_api.main:main"

[tool.uv.sources]
grolla-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grolla_api"]
