    <div class="welcome-speech">
      <div class="welcome-bubble" id="welcome-bubble" aria-live="polite">
        <span class="welcome-who" id="welcome-quem">Grolla</span>
        <span id="welcome-fala"></span><span class="welcome-caret"></span>
      </div>
      <div class="welcome-scene" id="welcome-scene"></div>
    </div>
  </div>
  <div class="welcome-foot">
    <div class="welcome-dots" id="welcome-dots" aria-label="Etapas"></div>
    <div class="welcome-actions">
      <button type="button" class="welcome-skip" id="welcome-pular">Pular</button>
      <button type="button" class="button-primary" id="welcome-proximo">Próximo</button>
    </div>
  </div>

  <template data-fala data-acena>
    <p data-texto>Opa! Eu sou o Grolla, o SRE de plantão que não dorme. Em um minuto eu te mostro como eu trabalho.</p>
    <div class="welcome-mini"><div class="welcome-row"><span class="welcome-pill welcome-pill-info">de plantão 24h</span><span class="muted">só leitura · nunca executo nada sozinho</span></div></div>
  </template>
  <template data-fala>
    <p data-texto>Tocou um alarme? Eu abro o incidente, dou a severidade e aviso o time no Teams na hora.</p>
    <div class="welcome-mini">
      <div class="welcome-row"><span class="welcome-pill welcome-pill-p1">P1</span><strong>Erros na pagamentos-api</strong></div>
      <div class="welcome-row muted">alerta recebido · card no Teams enviado · "Estou investigando"</div>
    </div>
  </template>
  <template data-fala>
    <p data-texto>Enquanto vocês chegam, eu já estou fuçando: métricas, logs, traces, deploys, AWS e o cluster.</p>
    <div class="welcome-mini welcome-checks">
      <span><i>✓</i>métricas</span><span><i>✓</i>logs</span><span><i>✓</i>traces</span>
      <span><i>✓</i>deploys</span><span><i>✓</i>AWS</span><span><i>✓</i>cluster</span>
    </div>
  </template>
  <template data-fala>
    <p data-texto>Testo cada hipótese até a causa raiz e te passo o comando, dizendo onde rodar. Quem aplica é você.</p>
    <div class="welcome-mini">
      <div class="welcome-row"><span class="welcome-pill welcome-pill-ok">causa confirmada</span><span class="muted">Onde rodar: <strong>cluster lab-k3s, namespace loja</strong></span></div>
      <div class="command"><code>kubectl scale deployment antifraude-api --replicas=2 -n loja</code></div>
      <div class="welcome-row"><span class="welcome-fake-button">Copiar</span><span class="welcome-fake-button welcome-fake-primary">Apliquei</span></div>
    </div>
  </template>
  <template data-fala>
    <p data-texto>No war room, me chama no chat. Eu respondo com evidência e anoto tudo o que o time fez.</p>
    <div class="welcome-mini welcome-chat">
      <span class="welcome-msg welcome-msg-me">quais comandos eu rodo pra voltar ao normal?</span>
      <span class="welcome-msg">Escale o antifraude-api para 2 réplicas e acompanhe o rollout.</span>
    </div>
  </template>
  <template data-fala>
    <p data-texto>Normalizou? Eu aviso. Encerrou? Escrevo o post mortem e aprendo para a próxima. Bora?</p>
    <div class="welcome-mini">
      <div class="welcome-row"><span class="welcome-pill welcome-pill-ok">normalizado</span><span class="muted">post mortem em rascunho · memória atualizada</span></div>
      <svg class="welcome-spark" viewBox="0 0 300 44" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 34 L40 33 L70 35 L95 8 L120 6 L150 9 L175 30 L210 34 L250 33 L300 34 L300 44 L0 44 Z" class="welcome-spark-area"/>
        <path d="M0 34 L40 33 L70 35 L95 8 L120 6 L150 9 L175 30 L210 34 L250 33 L300 34" class="welcome-spark-line"/>
        <circle cx="300" cy="34" r="3" class="welcome-spark-end"/>
      </svg>
    </div>
  </template>
