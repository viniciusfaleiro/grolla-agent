[project]
name = "grolla-core"
# A versão do produto vive só no pyproject.toml do projeto pai; os pacotes não são publicados.
version = "0.0.0"
description = "Núcleo do agent-grolla: domínio, casos de uso, ports e adapters de saída."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic",
    "anthropic",
    "boto3",
    "httpx2",
    "mcp",
    "procrastinate",
    "psycopg[binary]",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "sqlalchemy[asyncio]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grolla"]
