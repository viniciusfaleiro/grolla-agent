# Com o LLM fora do ar, a análise sai parcial por falha do LLM e o canal recebe o card
# "investigando" e depois o card de análise parcial. Sem hipóteses, a validação não é pedida.
# O modo do LLM fake vale para qualquer análise em andamento: troca antes do alerta e volta para
# "completa" no fim.
name: LLM fora do ar gera análise parcial
given:
  fakes:
    routes:
      - { method: POST, path: /teams/webhook, status: 202 }
when:
  - http:
      service: fakes
      method: POST
      path: /_control/llm
      json: { mode: fora_do_ar }
      status: 204
  - http:
      service: api
      method: POST
      path: /webhooks/alerts
      auth: [signoz, segredo-do-e2e]
      status: 202
      json:
        receiver: grolla-credenciadora
        status: firing
        version: "4"
        alerts:
          - status: firing
            labels:
              alertname: Taxa de erro alta no llm-fora-api
              service_name: llm-fora-api
              severity: critical
              team: credenciadora
            annotations:
              summary: Taxa de erro de 7,2% no llm-fora-api
              description: A taxa de erro HTTP 5xx do llm-fora-api está em 7,2% (limite 2%).
            startsAt: "2026-01-01T10:00:00Z"
            endsAt: "0001-01-01T00:00:00Z"
            generatorURL: https://signoz.interno/alerts/edit?ruleId=112
            fingerprint: e2e-llm-fora-api-1
then:
  - expect_fake_request_order:
      path: /teams/webhook
      first: [llm-fora-api, P1, Estou investigando]
      then: [llm-fora-api, Análise parcial, LLM indisponível]
      timeout_seconds: 60
  - expect_fake_requests:
      path: /teams/webhook
      contains: [llm-fora-api]
      count: 2
  - expect_db_count:
      sql: >-
        SELECT count(*) FROM analyses a JOIN incidents i ON i.id = a.incident_id
        WHERE 'llm-fora-api' = ANY(i.services) AND a.status = 'parcial'
        AND a.partial_reason = 'falha_do_llm'
      count: 1
  # Parcial e sem hipóteses: a validação não é pedida (nem card de causa raiz, na contagem acima).
  - expect_db_count:
      sql: >-
        SELECT count(*) FROM verifications v JOIN incidents i ON i.id = v.incident_id
        WHERE 'llm-fora-api' = ANY(i.services)
      count: 0
  - http:
      service: fakes
      method: POST
      path: /_control/llm
      json: { mode: completa }
      status: 204
