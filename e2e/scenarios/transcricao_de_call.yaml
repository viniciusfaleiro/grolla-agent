# Ana envia o `.vtt` da call do war room. O worker extrai a decisão do rollback, a ação do Bruno,
# o horário das 03:20, os participantes e a hipótese do banco descartada pela call: cada item vira
# evento com a origem "transcrição", aparece na timeline do incidente e, depois de Ana encerrar,
# na timeline do post mortem. Alerta `warning` vira P2: o acompanhamento de P0/P1 fica de fora.
name: transcrição da call vira itens na timeline e no post mortem
given:
  fakes:
    routes:
      - { method: POST, path: /teams/webhook, status: 202 }
when:
  - http:
      service: api
      method: POST
      path: /webhooks/alerts
      auth: [signoz, segredo-do-e2e]
      status: 202
      json:
        receiver: grolla-credenciadora
        status: firing
        version: "4"
        alerts:
          - status: firing
            labels:
              alertname: Taxa de erro alta no call-api
              service_name: call-api
              severity: warning
              team: credenciadora
            annotations:
              summary: Taxa de erro de 4,1% no call-api
              description: A taxa de erro HTTP 5xx do call-api está em 4,1% (limite 2%).
            startsAt: "2026-01-01T10:00:00Z"
            endsAt: "0001-01-01T00:00:00Z"
            generatorURL: https://signoz.interno/alerts/edit?ruleId=170
            fingerprint: e2e-call-1
  - capture:
      name: incidente
      sql: SELECT id FROM incidents WHERE 'call-api' = ANY(services)
  # A extração usa a análise como contexto: envia a transcrição depois dela.
  - wait_for_db_row:
      sql: >-
        SELECT count(*) FROM incident_events WHERE incident_id = '{incidente}'
        AND type = 'analysis_completed'
      at_least: 1
      timeout_seconds: 60
  # A escrita redireciona para o incidente; o runner não segue o redirect nem confere o status.
  - http:
      service: api
      method: POST
      path: /incidents/{incidente}/transcricao
      cookies: { grolla_author: Ana }
      form:
        texto: |
          WEBVTT

          00:00:01.000 --> 00:00:05.000
          <v Ana>vamos fazer rollback do build 20261027.1</v>

          00:00:06.000 --> 00:00:10.000
          <v Bruno>o Bruno fica com o rollback às 03:20</v>

          00:00:11.000 --> 00:00:15.000
          <v Carla>não foi o banco, o pool está normal</v>
then:
  - expect_db_count:
      sql: >-
        SELECT count(*) FROM incident_events WHERE incident_id = '{incidente}'
        AND type = 'transcript_received' AND author = 'Ana'
      count: 1
  - wait_for_db_row:
      sql: >-
        SELECT count(*) FROM transcripts WHERE incident_id = '{incidente}' AND author = 'Ana'
        AND status = 'concluida' AND finished_at IS NOT NULL
      at_least: 1
      timeout_seconds: 60
  - expect_db_count:
      sql: >-
        SELECT count(*) FROM incident_events WHERE incident_id = '{incidente}'
        AND type = 'transcript_item' AND data->>'kind' = 'decisao'
        AND data->>'origin' = 'transcrição' AND data->>'text' LIKE '%rollback do build 20261027.1%'
        AND data->>'excerpt' LIKE '%vamos fazer rollback do build 20261027.1%'
      count: 1
  - expect_db_count:
      sql: >-
        SELECT count(*) FROM incident_events WHERE incident_id = '{incidente}'
        AND type = 'transcript_item' AND data->>'kind' = 'acao' AND data->>'owner' = 'Bruno'
        AND data->>'origin' = 'transcrição'
      count: 1
  - expect_db_count:
      sql: >-
        SELECT count(*) FROM incident_events WHERE incident_id = '{incidente}'
        AND type = 'transcript_item' AND data->>'kind' = 'horario'
        AND data->>'said_at' = '03:20' AND data->>'origin' = 'transcrição'
      count: 1
  - expect_db_count:
      sql: >-
        SELECT count(*) FROM incident_events WHERE incident_id = '{incidente}'
        AND type = 'transcript_participants' AND data->'names' ?& array['Ana', 'Bruno', 'Carla']
      count: 1
  - expect_db_count:
      sql: >-
        SELECT count(*) FROM incident_events WHERE incident_id = '{incidente}'
        AND type = 'transcript_hypothesis' AND data->>'verdict' = 'descartada'
        AND data->>'excerpt' LIKE '%não foi o banco%'
      count: 1
  # A transcrição é evidência: o estado e a severidade do incidente não mudam.
  - expect_db_count:
      sql: >-
        SELECT count(*) FROM incidents WHERE id = '{incidente}' AND state IN ('detectado', 'informado')
        AND severity = 'P2'
      count: 1
  - expect_page:
      service: api
      path: /incidents/{incidente}
      contains:
        - Transcrição enviada por Ana
        - Decisão
        - "origem: transcrição"
        - vamos fazer rollback do build 20261027.1
        - Bruno
        - não foi o banco
  # Ana encerra: o post mortem traz os itens da call na timeline, com a origem.
  - http:
      service: api
      method: POST
      path: /incidents/{incidente}/actions/assume
      cookies: { grolla_author: Ana }
      status: 200
  - http:
      service: api
      method: POST
      path: /incidents/{incidente}/actions/resolve
      cookies: { grolla_author: Ana }
      form: { motivo: rollback do build 20261027.1 }
      status: 200
  - wait_for_db_row:
      sql: >-
        SELECT count(*) FROM post_mortems WHERE incident_id = '{incidente}'
        AND status = 'rascunho'
      at_least: 1
      timeout_seconds: 90
  - expect_page:
      service: api
      path: /postmortems/{incidente}
      contains: [Timeline, "[transcrição]", rollback do build 20261027.1, "03:20"]
