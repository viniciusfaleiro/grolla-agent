# Alerta novo do time vira incidente e um card no canal (warning → P2).
name: alerta novo vira incidente e card
given:
  fakes:
    routes:
      - { method: POST, path: /teams/webhook, status: 202 }
when:
  - http:
      service: api
      method: POST
      path: /webhooks/alerts
      auth: [signoz, segredo-do-e2e]
      status: 202
      json:
        receiver: grolla-credenciadora
        status: firing
        version: "4"
        alerts:
          - status: firing
            labels:
              alertname: Latência alta no novo-api
              service_name: novo-api
              severity: warning
              team: credenciadora
            annotations:
              summary: p99 de 1,8 s no novo-api
              description: O p99 de latência do novo-api está em 1,8 s (limite 800 ms).
            startsAt: "2026-01-01T10:00:00Z"
            endsAt: "0001-01-01T00:00:00Z"
            generatorURL: https://signoz.interno/alerts/edit?ruleId=101
            fingerprint: e2e-novo-1
then:
  - expect_db_count:
      sql: SELECT count(*) FROM incidents WHERE 'novo-api' = ANY(services) AND severity = 'P2'
      count: 1
  - expect_fake_requests:
      path: /teams/webhook
      contains: [novo-api, P2]
      count: 1
