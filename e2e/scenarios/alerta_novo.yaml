# Alerta novo do time vira incidente (warning → P2): o canal recebe o card "investigando" e,
# com o roteiro padrão do LLM fake, depois o card da análise concluída e o da causa raiz. O uso do LLM fica gravado.
name: alerta novo vira incidente, investigando e análise
given:
  fakes:
    routes:
      - { method: POST, path: /teams/webhook, status: 202 }
when:
  - http:
      service: api
      method: POST
      path: /webhooks/alerts
      auth: [signoz, segredo-do-e2e]
      status: 202
      json:
        receiver: grolla-credenciadora
        status: firing
        version: "4"
        alerts:
          - status: firing
            labels:
              alertname: Latência alta no novo-api
              service_name: novo-api
              severity: warning
              team: credenciadora
            annotations:
              summary: p99 de 1,8 s no novo-api
              description: O p99 de latência do novo-api está em 1,8 s (limite 800 ms).
            startsAt: "2026-01-01T10:00:00Z"
            endsAt: "0001-01-01T00:00:00Z"
            generatorURL: https://signoz.interno/alerts/edit?ruleId=101
            fingerprint: e2e-novo-1
then:
  - expect_db_count:
      sql: SELECT count(*) FROM incidents WHERE 'novo-api' = ANY(services) AND severity = 'P2'
      count: 1
  - expect_fake_request_order:
      path: /teams/webhook
      first: [novo-api, P2, Estou investigando]
      then: [novo-api, Análise pronta, O que avaliei, Hipóteses, Plano proposto]
      timeout_seconds: 60
  - expect_fake_requests:
      path: /teams/webhook
      contains: [novo-api]
      count: 3
      timeout_seconds: 90
  - expect_db_count:
      sql: >-
        SELECT count(*) FROM analyses a JOIN incidents i ON i.id = a.incident_id
        WHERE 'novo-api' = ANY(i.services) AND a.status = 'concluida' AND a.partial_reason IS NULL
      count: 1
  - wait_for_db_row:
      sql: >-
        SELECT count(*) FROM llm_usage u JOIN incidents i ON i.id = u.incident_id
        WHERE 'novo-api' = ANY(i.services) AND u.stage = 'investigation'
      at_least: 1
      timeout_seconds: 5
