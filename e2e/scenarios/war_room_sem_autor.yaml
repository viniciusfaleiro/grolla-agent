# Sem o cookie do autor a ação é recusada com 401: toda ação do war room precisa de um nome.
name: war room recusa ação sem autor
given:
  fakes:
    routes:
      - { method: POST, path: /teams/webhook, status: 202 }
when:
  - http:
      service: api
      method: POST
      path: /webhooks/alerts
      auth: [signoz, segredo-do-e2e]
      status: 202
      json:
        receiver: grolla-credenciadora
        status: firing
        version: "4"
        alerts:
          - status: firing
            labels:
              alertname: Latência alta no sem-autor-api
              service_name: sem-autor-api
              severity: warning
              team: credenciadora
            annotations:
              summary: p99 de 1,8 s no sem-autor-api
              description: O p99 de latência do sem-autor-api está em 1,8 s (limite 800 ms).
            startsAt: "2026-01-01T10:00:00Z"
            endsAt: "0001-01-01T00:00:00Z"
            generatorURL: https://signoz.interno/alerts/edit?ruleId=132
            fingerprint: e2e-sem-autor-1
  - capture:
      name: incidente
      sql: SELECT id FROM incidents WHERE 'sem-autor-api' = ANY(services)
  - http:
      service: api
      method: POST
      path: /incidents/{incidente}/actions/assume
      status: 401
then:
  - expect_db_count:
      sql: >-
        SELECT count(*) FROM incidents WHERE id = '{incidente}'
        AND state IN ('detectado', 'informado') AND commander IS NULL AND handling_at IS NULL
      count: 1
  - expect_db_count:
      sql: >-
        SELECT count(*) FROM incident_events WHERE incident_id = '{incidente}'
        AND type = 'commander_assigned'
      count: 0
