# Com o LLM lento (além do timeout de 15 s do e2e), a análise sai parcial por tempo
# esgotado e o canal recebe o card "investigando" e depois o card de análise parcial.
# O modo do LLM fake vale para qualquer análise em andamento: troca antes do alerta e volta para
# "completa" no fim.
name: LLM lento gera análise parcial por tempo esgotado
given:
  fakes:
    routes:
      - { method: POST, path: /teams/webhook, status: 202 }
when:
  - http:
      service: fakes
      method: POST
      path: /_control/llm
      json: { mode: lenta }
      status: 204
  - http:
      service: api
      method: POST
      path: /webhooks/alerts
      auth: [signoz, segredo-do-e2e]
      status: 202
      json:
        receiver: grolla-credenciadora
        status: firing
        version: "4"
        alerts:
          - status: firing
            labels:
              alertname: Taxa de erro alta no llm-lenta-api
              service_name: llm-lenta-api
              severity: critical
              team: credenciadora
            annotations:
              summary: Taxa de erro de 7,2% no llm-lenta-api
              description: A taxa de erro HTTP 5xx do llm-lenta-api está em 7,2% (limite 2%).
            startsAt: "2026-01-01T10:00:00Z"
            endsAt: "0001-01-01T00:00:00Z"
            generatorURL: https://signoz.interno/alerts/edit?ruleId=113
            fingerprint: e2e-llm-lenta-api-1
then:
  - expect_fake_request_order:
      path: /teams/webhook
      first: [llm-lenta-api, P1, Estou investigando]
      then: [llm-lenta-api, Análise parcial, tempo esgotado]
      timeout_seconds: 60
  - expect_fake_requests:
      path: /teams/webhook
      contains: [llm-lenta-api]
      count: 2
  - expect_db_count:
      sql: >-
        SELECT count(*) FROM analyses a JOIN incidents i ON i.id = a.incident_id
        WHERE 'llm-lenta-api' = ANY(i.services) AND a.status = 'parcial'
        AND a.partial_reason = 'tempo_esgotado'
      count: 1
  - http:
      service: fakes
      method: POST
      path: /_control/llm
      json: { mode: completa }
      status: 204
