# Ana pergunta no console, fora de qualquer incidente, pelo gráfico de erro do console-api. Nasce
# a sessão com a pergunta como título, a resposta do agente chega pela fila do console com o
# gráfico pedido (serviço e sinal, sem números do modelo), o uso fica na etapa `console` sem
# incidente e a página da sessão desenha o gráfico em SVG com a série da telemetria.
name: pergunta no console com resposta e gráfico
given:
  fakes:
    routes:
      - { method: POST, path: /teams/webhook, status: 202 }
when:
  # A escrita redireciona para a sessão; o runner não segue o redirect nem confere o status.
  - http:
      service: api
      method: POST
      path: /console
      cookies: { grolla_author: Ana }
      form: { texto: Mostra o gráfico de erro do console-api }
  - capture:
      name: sessao
      sql: >-
        SELECT id FROM console_sessions WHERE author = 'Ana'
        AND title = 'Mostra o gráfico de erro do console-api'
then:
  - wait_for_db_row:
      sql: >-
        SELECT count(*) FROM console_messages r JOIN console_messages q ON q.id = r.reply_to
        WHERE r.session_id = '{sessao}' AND r.author = 'agente'
        AND jsonb_array_length(r.charts) >= 1 AND r.charts::text LIKE '%console-api%'
        AND r.charts::text LIKE '%taxa_de_erro%'
        AND q.author = 'Ana' AND q.text = 'Mostra o gráfico de erro do console-api'
        AND q.reply_status = 'respondida'
      at_least: 1
      timeout_seconds: 60
  - expect_db_count:
      sql: SELECT count(*) FROM console_messages WHERE session_id = '{sessao}'
      count: 2
  - wait_for_db_row:
      sql: SELECT count(*) FROM llm_usage WHERE stage = 'console' AND incident_id IS NULL
      at_least: 1
      timeout_seconds: 5
  - expect_page:
      service: api
      path: /console/{sessao}
      contains: [Mostra o gráfico de erro do console-api, <svg, Taxa de erro, console-api]
  # O console não vai para o canal.
  - expect_fake_requests:
      path: /teams/webhook
      contains: [console-api]
      count: 0
