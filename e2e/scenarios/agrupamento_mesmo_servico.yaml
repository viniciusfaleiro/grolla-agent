# Dois alertas diferentes do mesmo serviço entram num incidente só. O segundo chega depois da
# análise do primeiro: sem mudança de severidade, não gera card nem reabre a análise (os 2 cards
# são o "investigando" e a análise do primeiro alerta).
name: dois alertas do mesmo serviço agrupam sem nova análise
given:
  fakes:
    routes:
      - { method: POST, path: /teams/webhook, status: 202 }
when:
  - http:
      service: api
      method: POST
      path: /webhooks/alerts
      auth: [signoz, segredo-do-e2e]
      status: 202
      json:
        receiver: grolla-credenciadora
        status: firing
        version: "4"
        alerts:
          - status: firing
            labels:
              alertname: Latência alta no agrupa-api
              service_name: agrupa-api
              severity: warning
              team: credenciadora
            annotations:
              summary: p99 de 1,8 s no agrupa-api
              description: O p99 de latência do agrupa-api está em 1,8 s (limite 800 ms).
            startsAt: "2026-01-01T10:00:00Z"
            endsAt: "0001-01-01T00:00:00Z"
            generatorURL: https://signoz.interno/alerts/edit?ruleId=103
            fingerprint: e2e-agrupa-1
  - wait_for_db_row:
      sql: >-
        SELECT count(*) FROM analyses a JOIN incidents i ON i.id = a.incident_id
        WHERE 'agrupa-api' = ANY(i.services) AND a.status = 'concluida'
      at_least: 1
      timeout_seconds: 60
  - http:
      service: api
      method: POST
      path: /webhooks/alerts
      auth: [signoz, segredo-do-e2e]
      status: 202
      json:
        receiver: grolla-credenciadora
        status: firing
        version: "4"
        alerts:
          - status: firing
            labels:
              alertname: Fila de autorizações crescendo no agrupa-api
              service_name: agrupa-api
              severity: warning
              team: credenciadora
            annotations:
              summary: Fila com 5 mil mensagens no agrupa-api
              description: A fila de autorizações do agrupa-api passou de 5 mil mensagens.
            startsAt: "2026-01-01T10:05:00Z"
            endsAt: "0001-01-01T00:00:00Z"
            generatorURL: https://signoz.interno/alerts/edit?ruleId=104
            fingerprint: e2e-agrupa-2
then:
  - expect_db_count:
      sql: SELECT count(*) FROM incidents WHERE 'agrupa-api' = ANY(services)
      count: 1
  - expect_db_count:
      sql: >-
        SELECT count(*) FROM alerts a JOIN incidents i ON i.id = a.incident_id
        WHERE 'agrupa-api' = ANY(i.services)
      count: 2
  - expect_db_count:
      sql: >-
        SELECT count(*) FROM analyses a JOIN incidents i ON i.id = a.incident_id
        WHERE 'agrupa-api' = ANY(i.services)
      count: 1
  - expect_fake_requests:
      path: /teams/webhook
      contains: [agrupa-api, Análise pronta]
      count: 1
      timeout_seconds: 60
  - expect_fake_requests:
      path: /teams/webhook
      contains: [agrupa-api]
      count: 2
