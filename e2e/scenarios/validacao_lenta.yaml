# Com o LLM lento só na validação (além do timeout de 15 s do e2e), a análise inicial sai
# completa e a validação termina parcial por tempo esgotado: o card diz que é parcial e o motivo.
# O modo do LLM fake vale para qualquer validação em andamento: troca antes do alerta e volta
# para "completa" no fim.
name: validação lenta termina parcial por tempo esgotado
given:
  fakes:
    routes:
      - { method: POST, path: /teams/webhook, status: 202 }
when:
  - http:
      service: fakes
      method: POST
      path: /_control/llm
      json: { verification_mode: lenta }
      status: 204
  - http:
      service: api
      method: POST
      path: /webhooks/alerts
      auth: [signoz, segredo-do-e2e]
      status: 202
      json:
        receiver: grolla-credenciadora
        status: firing
        version: "4"
        alerts:
          - status: firing
            labels:
              alertname: Taxa de erro alta no validacao-lenta-api
              service_name: validacao-lenta-api
              severity: critical
              team: credenciadora
            annotations:
              summary: Taxa de erro de 7,2% no validacao-lenta-api
              description: A taxa de erro HTTP 5xx do validacao-lenta-api está em 7,2%.
            startsAt: "2026-01-01T10:00:00Z"
            endsAt: "0001-01-01T00:00:00Z"
            generatorURL: https://signoz.interno/alerts/edit?ruleId=115
            fingerprint: e2e-validacao-lenta-1
then:
  - expect_fake_request_order:
      path: /teams/webhook
      first: [validacao-lenta-api, Análise pronta, Estou validando as hipóteses]
      then: [validacao-lenta-api, "Validação parcial · P1", "Motivo: tempo esgotado"]
      timeout_seconds: 90
  - expect_fake_requests:
      path: /teams/webhook
      contains: [validacao-lenta-api]
      count: 3
  - expect_db_count:
      sql: >-
        SELECT count(*) FROM verifications v JOIN incidents i ON i.id = v.incident_id
        WHERE 'validacao-lenta-api' = ANY(i.services) AND v.status = 'parcial'
        AND v.partial_reason = 'tempo_esgotado'
      count: 1
  - http:
      service: fakes
      method: POST
      path: /_control/llm
      json: { verification_mode: completa }
      status: 204
