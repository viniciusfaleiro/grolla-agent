# Dois clusters do e2e, os dois servidos pela API do Kubernetes fake do grolla-fakes.
apiVersion: v1
kind: Config
clusters:
  - name: nao-pci
    cluster: { server: "http://fakes:9000/k8s/nao-pci" }
  - name: pci
    cluster: { server: "http://fakes:9000/k8s/pci" }
users:
  - name: grolla
    user: { token: token-do-e2e }
contexts:
  - name: nao-pci
    context: { cluster: nao-pci, user: grolla }
  - name: pci
    context: { cluster: pci, user: grolla }
current-context: nao-pci
