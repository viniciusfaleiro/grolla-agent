# Configuração do time usada pela api e pelo worker no e2e (montada em /etc/grolla/grolla.yaml).
team: credenciadora
page_base_url: http://localhost:8000
alert_filter: { team: credenciadora }
service_labels: [service_name, service.name]
grouping_window_minutes: 15
default_severity: P3
severity_rules:
  - match: { alertname: "Queda de aprovação" }
    severity: P0
  - match: { severity: critical }
    severity: P1
  - match: { severity: warning }
    severity: P2

# Investigação: tudo aponta para o grolla-fakes. Timeout curto para o cenário de tempo esgotado
# (o modo "lenta" do LLM fake espera mais que isso).
investigation:
  timeout_seconds: 15
  max_tokens: 300000
  lookback_minutes: 60
  max_parallel: 3
  verification_timeout_seconds: 15
  verification_max_tokens: 150000
  chat_timeout_seconds: 15
  chat_max_tokens: 60000
  chat_max_tokens_per_incident: 400000
llm:
  stages:
    investigation: { model: claude-sonnet-5-5, effort: medium, max_tokens: 16000 }
signoz:
  mcp_url: http://fakes:9000/signoz/mcp
  base_url: http://localhost:9000/signoz
azure_devops:
  base_url: http://fakes:9000/azure-devops/credenciadora
  projects: [Core]
  service_repo_map:
    autorizador: { project: Core, repo: authorizer-api }
# Memória viva: o estudo inicial roda na subida do worker, contra os fakes.
memory:
  learning_max_tokens: 60000
  study:
    run_max_tokens: 400000
    service_max_tokens: 100000
