# Configuração da instância da Credenciadora. Sem segredos aqui: eles ficam no .env.
team: credenciadora
# URL pela qual o time abre as páginas dos incidentes (rede interna).
page_base_url: http://grolla-credenciadora.interno:8000

# Só alertas com TODOS estes labels entram. Ajuste quando os labels reais forem conhecidos.
alert_filter:
  team: credenciadora

# O serviço do alerta vem do primeiro destes labels presente; sem nenhum, "desconhecido".
service_labels: [service_name, service.name]

# Alerta do mesmo serviço com atividade nos últimos N minutos entra no mesmo incidente.
grouping_window_minutes: 15

# A primeira regra que casa (todos os labels do match) define a severidade.
default_severity: P3
severity_rules:
  - match: { alertname: "Queda de aprovação" }
    severity: P0
  - match: { severity: critical }
    severity: P1
  - match: { severity: warning }
    severity: P2

# ---- Investigação (S3) ----
# Limites da análise inicial de cada incidente novo. Passou do tempo ou dos tokens, o card de
# análise sai como parcial.
investigation:
  timeout_seconds: 300
  max_tokens: 300000
  lookback_minutes: 60
  max_parallel: 3
  # Validação das hipóteses até a causa raiz (segunda fase, logo depois da análise inicial).
  verification_timeout_seconds: 300
  verification_max_tokens: 150000

# Modelo por etapa; trocar é mudar aqui e reiniciar o worker.
llm:
  stages:
    investigation: { model: claude-sonnet-5-5, effort: medium, max_tokens: 16000 }
    verification: { model: claude-sonnet-5-5, effort: high, max_tokens: 16000 }

signoz:
  mcp_url: http://signoz-mcp:8000/mcp       # container do deploy/compose.yml
  base_url: https://signoz.interno          # ajuste: links "Ver no SigNoz" nos cards

azure_devops:
  base_url: https://dev.azure.com/troque-organizacao
  projects: [troque-projeto]                # onde procurar um repositório com o nome do serviço
  service_repo_map: {}                      # só as exceções: servico: { project: X, repo: Y }

# Consulta à nuvem (somente leitura): estado dos recursos do serviço, mudanças no CloudTrail e
# alarmes do CloudWatch. Recursos achados pela tag service=<nome>; o mapa cobre as exceções.
# Sem esta seção, as ferramentas de nuvem respondem que a consulta não está configurada.
cloud:
  regions: [us-east-1]
  resource_map: {}            # servico: [arn ou identificador, ...]

# ---- Memória viva ----
# Aprendizado ao encerrar cada incidente (sempre ligado) e estudo do ambiente: inicial na primeira
# subida e diário no cron. Sem `study`, o agente não estuda o ambiente sozinho.
memory:
  learning_max_tokens: 60000
  study:
    cron: "0 6 * * *"          # 06:00 UTC
    run_max_tokens: 400000      # teto de uma rodada inteira
    service_max_tokens: 100000  # teto do estudo de um serviço
    lookback_days: 7            # janela de deploys, traces e métricas do estudo

# ---- Acompanhamento da crise (S5) ----
# P0/P1 abertos recebem um ciclo a cada 5 min: card só quando muda, curto a cada 15 min, e a
# proposta de mitigar ou encerrar depois de 15 min normalizado (quem decide é o time).
follow_up:
  severities: [P0, P1]
  cycle_minutes: 5
  quiet_minutes: 15
  stable_minutes: 15
  max_cycles: 24
# Impacto financeiro estimado: valor em risco por minuto com 100% de erro, por serviço.
impact:
  currency: BRL
  services: {}              # ex.: autorizador: { per_minute: 25000 }

# ---- Menos ruído (S8) ----
# Triagem de todo incidente novo: o agente sugere juntar com outro aberto na janela (quem junta é
# o time) e sobe a severidade quando nenhuma regra casou (nunca baixa).
noise:
  window_minutes: 30
