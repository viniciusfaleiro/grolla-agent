# Uma instância do agent-grolla. Não rode à mão: o deploy/implantar.sh gera, a partir do arquivo de
# implantação, os arquivos da pasta da instância (.env, grolla.env, grolla.yaml, …), constrói as
# imagens e sobe este compose com --project-directory nessa pasta. Os caminhos relativos abaixo
# são dela. Partes opcionais entram por perfil (COMPOSE_PROFILES no .env gerado):
#   https       Caddy com certificado automático e senha na frente da api
#   teams-fake  grolla-fakes no lugar do Teams (laboratório)
#   signoz-mcp  servidor MCP oficial do SigNoz ao lado do agente
name: grolla

x-grolla: &grolla
  restart: unless-stopped
  env_file: grolla.env
  depends_on:
    db:
      condition: service_healthy
  # host.docker.internal: o que roda no host (um túnel até o SigNoz, a API de um k3s local).
  extra_hosts: ["host.docker.internal:host-gateway"]

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: grolla
      POSTGRES_USER: grolla
      POSTGRES_PASSWORD: ${GROLLA_DB_PASSWORD:?rode o deploy/implantar.sh}
    volumes:
      - grolla-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grolla -d grolla"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    <<: *grolla
    image: grolla-api:local
    environment:
      GROLLA_DATABASE_URL: postgresql://grolla:${GROLLA_DB_PASSWORD}@db:5432/grolla
      GROLLA_CONFIG_FILE: /etc/grolla/grolla.yaml
    volumes:
      - ./grolla.yaml:/etc/grolla/grolla.yaml:ro
    ports:
      - "${GROLLA_API_PORT:-8000}:8000"

  worker:
    <<: *grolla
    image: grolla-worker:local
    environment:
      GROLLA_DATABASE_URL: postgresql://grolla:${GROLLA_DB_PASSWORD}@db:5432/grolla
      GROLLA_CONFIG_FILE: /etc/grolla/grolla.yaml
    volumes:
      - ./grolla.yaml:/etc/grolla/grolla.yaml:ro
      # Vazio quando nenhum cluster é lido por kubeconfig.
      - ./kubeconfig.yaml:/etc/grolla/kubeconfig.yaml:ro

  fakes:
    profiles: [teams-fake]
    image: grolla-fakes:local
    restart: unless-stopped
    env_file: grolla.env
    environment:
      GROLLA_FAKES_API_URL: http://api:8000

  # A telemetria da investigação: só na rede interna (sem porta publicada), com a API key de
  # papel Viewer. O agente só chama ferramentas de leitura de uma lista fechada.
  signoz-mcp:
    profiles: [signoz-mcp]
    image: signoz/signoz-mcp-server:v0.16.0
    restart: unless-stopped
    env_file: signoz-mcp.env
    environment:
      TRANSPORT_MODE: http
      MCP_SERVER_PORT: "8000"

  caddy:
    profiles: [https]
    image: caddy:2.8.4
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  grolla-pgdata:
  caddy-data:
